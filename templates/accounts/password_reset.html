{% extends 'base.html' %}

{% block title %}Reset Password - TECHSPIRE Learning{% endblock %}

{% block content %}
<div class="py-5 bg-light min-vh-75 d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
          <div class="text-center mb-4">
            <h4 class="fw-bold">Reset Your Password</h4>
            <p class="text-muted small">Enter your account email to receive reset instructions</p>
          </div>

          <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label small fw-bold">Email Address</label>
              <input type="email" name="email" class="form-control" placeholder="Registered email address" required>
            </div>
            <button type="submit" class="btn btn-ts-primary w-100 py-2 fw-bold">Send Reset Link</button>
          </form>

          <div class="text-center mt-4 small">
            <a href="{% url 'accounts:login' %}" class="text-decoration-none">Back to Log In</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
