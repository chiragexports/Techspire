{% extends 'base.html' %}

{% block title %}Log In - TECHSPIRE Learning{% endblock %}

{% block content %}
<div class="py-5 bg-light min-vh-75 d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
          <div class="text-center mb-4">
            <div class="ts-brand justify-content-center mb-2">
              <i class="fas fa-graduation-cap text-primary"></i> TECHSPIRE<span>.</span>
            </div>
            <h4 class="fw-bold text-dark">Welcome Back!</h4>
            <p class="text-muted small">Log in to continue your learning journey</p>
          </div>

          <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next|default:'' }}">

            <div class="mb-3">
              <label class="form-label small fw-bold text-dark">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
                {{ form.username }}
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label small fw-bold text-dark mb-0">Password</label>
                <a href="{% url 'accounts:password_reset' %}" class="small text-decoration-none">Forgot?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                {{ form.password }}
              </div>
            </div>

            <button type="submit" class="btn btn-ts-primary w-100 py-2 fw-bold mt-2">
              Log In <i class="fas fa-arrow-right ms-2"></i>
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top small text-muted">
            Don't have an account yet? 
            <a href="{% url 'accounts:register' %}" class="fw-bold text-primary text-decoration-none">Sign Up Free</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
