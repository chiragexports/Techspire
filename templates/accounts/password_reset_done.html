{% extends 'base.html' %}

{% block title %}Password Reset Email Sent - TECHSPIRE Learning{% endblock %}

{% block content %}
<div class="py-5 bg-light min-vh-75 d-flex align-items-center">
  <div class="container text-center" style="max-width: 550px;">
    <div class="card border-0 shadow-lg rounded-4 p-5 bg-white">
      <div class="text-success fs-1 mb-3"><i class="fas fa-paper-plane"></i></div>
      <h3 class="fw-bold">Check Your Email</h3>
      <p class="text-muted">We have sent password reset instructions to your email address if an account is registered with it.</p>
      <a href="{% url 'accounts:login' %}" class="btn btn-primary rounded-pill px-4 fw-bold">Return to Login</a>
    </div>
  </div>
</div>
{% endblock %}
